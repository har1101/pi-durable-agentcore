name: Deploy AgentCore Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: agentcore-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Create or update AgentCore Runtime
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AGENTCORE_EXECUTION_ROLE_ARN: ${{ vars.AGENTCORE_EXECUTION_ROLE_ARN }}
          AGENT_RUNTIME_NAME: ${{ vars.AGENT_RUNTIME_NAME }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy-agentcore.sh

      - name: Live crash-resume against AgentCore
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AGENT_RUNTIME_NAME: ${{ vars.AGENT_RUNTIME_NAME }}
          LIVE_LOG_DIR: ${{ runner.temp }}/agentcore-live
        run: bash scripts/live-agentcore-crash-resume.sh

      - name: Upload live test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-live-logs
          path: ${{ runner.temp }}/agentcore-live
          if-no-files-found: warn

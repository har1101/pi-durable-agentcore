AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC, ECR, and least-privilege roles for the Pi Durable AgentCore PoC

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub organization or user (for example har1101)
  GitHubRepository:
    Type: String
    Default: pi-durable-agentcore
    Description: Repository name without the owner
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch may assume the deployment role
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Optional existing token.actions.githubusercontent.com provider ARN
  EcrRepositoryName:
    Type: String
    Default: pi-durable-agentcore
  GitHubEnvironment:
    Type: String
    Default: agentcore-poc
    Description: GitHub Actions environment whose OIDC sub may assume the deploy role
  SessionTableName:
    Type: String
    Default: pi-durable-agentcore-sessions
    Description: DynamoDB table for Pi Durable session checkpoints
  GitHubOidcSubPrefix:
    Type: String
    Default: repo:har1101@174846912/pi-durable-agentcore@1422425297
    Description: Immutable GitHub Actions OIDC sub prefix (repo:ownerId/repoId) when use_immutable_subject is true
  AgentRuntimeArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the deployed AgentCore runtime (AGENT_RUNTIME_ARN printed by scripts/deploy-agentcore.sh).
      Empty creates only the wake index; set it to also create the resume sweeper.
  ResumeSweepSchedule:
    Type: String
    Default: rate(1 minute)
    Description: EventBridge Scheduler expression for the resume sweeper (worst-case resume latency)
  ResumeQualifier:
    Type: String
    Default: DEFAULT
    Description: AgentCore runtime endpoint the sweeper invokes

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  CreateResumeSweeper: !Not [!Equals [!Ref AgentRuntimeArn, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the newest 20 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 20
              },
              "action": { "type": "expire" }
            }]
          }

  SessionStore:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref SessionTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: wakeShard
          AttributeType: S
        - AttributeName: wakeAt
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Sparse index of sessions that need an automatic resume (WAKE items in
      # the w#<sha256(session)> partitions). Adding a GSI is an in-place
      # UpdateTable: the table, its data, and its name are kept.
      GlobalSecondaryIndexes:
        - IndexName: wake-index
          KeySchema:
            - AttributeName: wakeShard
              KeyType: HASH
            - AttributeName: wakeAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AgentRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullThisRepositoryImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
        - PolicyName: InvokeClaudeOnBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*anthropic.claude-*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-*
        - PolicyName: ReadWriteThisSessionTable
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt SessionStore.Arn
                  - !Sub ${SessionStore.Arn}/index/*
        - PolicyName: WriteAgentCoreRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
        - PolicyName: EmitXRayAndMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub ${GitHubOidcSubPrefix}:environment:${GitHubEnvironment}
                  - !Sub ${GitHubOidcSubPrefix}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: PushThisEcrRepository
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
        - PolicyName: DeployThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverRuntime
                Effect: Allow
                Action: bedrock-agentcore:ListAgentRuntimes
                Resource: "*"
              - Sid: CreateTaggedRuntime
                Effect: Allow
                Action: bedrock-agentcore:CreateAgentRuntime
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: pi-durable-agentcore
              - Sid: ManageRuntimeEndpointsAndVersions
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntimeEndpoint
                  - bedrock-agentcore:CreateAgentRuntimeVersion
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:GetAgentRuntimeVersion
                  - bedrock-agentcore:ListAgentRuntimeEndpoints
                  - bedrock-agentcore:ListAgentRuntimeVersions
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-version/*
              - Sid: TagThisRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:TagResource
                  - bedrock-agentcore:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-version/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*/workload-identity/*
              - Sid: ListWorkloadIdentities
                Effect: Allow
                Action: bedrock-agentcore:ListWorkloadIdentities
                Resource: "*"
              - Sid: ManageWorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:GetWorkloadIdentity
                  - bedrock-agentcore:UpdateWorkloadIdentity
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*/workload-identity/*
              - Sid: UpdateTaggedRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:UpdateAgentRuntime
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: pi-durable-agentcore
              - Sid: PassOnlyExecutionRoleToAgentCore
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentRuntimeExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
        - PolicyName: InvokeThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeAndStopRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:InvokeAgentRuntimeForUser
                  - bedrock-agentcore:StopRuntimeSession
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
        - PolicyName: ReadAgentCoreRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: ReadRuntimeLogStreams
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*

  ResumeSweeperRole:
    Type: AWS::IAM::Role
    Condition: CreateResumeSweeper
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ClaimDueWakeItems
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: QueryDueSessions
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${SessionStore.Arn}/index/wake-index
              - Sid: ClaimOnlyWakeItems
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt SessionStore.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - w#*
        - PolicyName: ResumeThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Ref AgentRuntimeArn
                  - !Sub ${AgentRuntimeArn}/runtime-endpoint/*

  # Finds WAKE items with wakeAt <= now (crash with nobody retrying, approval
  # deadline, timed wait), claims each one with a conditional write so
  # concurrent sweeps invoke a session at most once per claim window, and
  # sends {"type":"resume"} to the runtime with the session's own id. The
  # runtime answers 202 at once and resumes from DynamoDB; it reschedules or
  # clears the WAKE item itself. test/auto-resume.integration.test.ts runs
  # this exact code (exports.sweep) against DynamoDB Local.
  ResumeSweeperFunction:
    Type: AWS::Lambda::Function
    Condition: CreateResumeSweeper
    Properties:
      Description: Resume Pi Durable AgentCore sessions whose WAKE time is due
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt ResumeSweeperRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionStore
          WAKE_INDEX_NAME: wake-index
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          QUALIFIER: !Ref ResumeQualifier
          CLAIM_MS: "120000"
          MAX_CLAIMS: "20"
      Code:
        ZipFile: |
          'use strict';
          const SHARD = 'wake';
          exports.sweep = async (o) => {
            const { QueryCommand, UpdateItemCommand } = o.ddb;
            const now = o.now ?? Date.now();
            const n = { N: String(now) };
            const r = { due: 0, claimed: 0, invoked: 0, failed: 0, skipped: 0 };
            let start;
            do {
              const page = await o.client.send(new QueryCommand({
                TableName: o.table, IndexName: o.index, Limit: 100, ExclusiveStartKey: start,
                KeyConditionExpression: 'wakeShard = :s AND wakeAt <= :n',
                ExpressionAttributeValues: { ':s': { S: SHARD }, ':n': n } }));
              for (const it of page.Items || []) {
                r.due++;
                try {
                  // Claim: only one sweep per window resumes a session; a runtime
                  // write (new wakeAt) clears the claim and the counter.
                  await o.client.send(new UpdateItemCommand({
                    TableName: o.table, Key: { pk: it.pk, sk: it.sk },
                    UpdateExpression: 'SET claimUntil = :c ADD claims :one',
                    ConditionExpression: 'wakeShard = :s AND wakeAt <= :n AND ' +
                      '(attribute_not_exists(claimUntil) OR claimUntil < :n) AND ' +
                      '(attribute_not_exists(claims) OR claims < :max)',
                    ExpressionAttributeValues: { ':s': { S: SHARD }, ':n': n, ':one': { N: '1' },
                      ':c': { N: String(now + (o.claimMs || 120000)) },
                      ':max': { N: String(o.maxClaims || 20) } } }));
                } catch (e) {
                  if (e.name === 'ConditionalCheckFailedException') { r.skipped++; continue; }
                  throw e;
                }
                r.claimed++;
                try {
                  await o.invoke(it.sessionId.S, { type: 'resume', reason: it.reason ? it.reason.S : 'unknown' });
                  r.invoked++;
                } catch (e) {
                  r.failed++;
                  console.error('resume failed', it.pk.S, e.name, e.message);
                }
              }
              start = page.LastEvaluatedKey;
            } while (start);
            console.log(JSON.stringify(r));
            return r;
          };
          exports.handler = async () => {
            const ddb = require('@aws-sdk/client-dynamodb');
            const ac = require('@aws-sdk/client-bedrock-agentcore');
            const agent = new ac.BedrockAgentCoreClient({});
            const env = process.env;
            return exports.sweep({
              ddb, client: new ddb.DynamoDBClient({}), table: env.TABLE_NAME, index: env.WAKE_INDEX_NAME,
              claimMs: Number(env.CLAIM_MS), maxClaims: Number(env.MAX_CLAIMS),
              invoke: async (id, payload) => {
                const out = await agent.send(new ac.InvokeAgentRuntimeCommand({
                  agentRuntimeArn: env.AGENT_RUNTIME_ARN, qualifier: env.QUALIFIER, runtimeSessionId: id,
                  contentType: 'application/json', accept: 'application/json',
                  payload: new TextEncoder().encode(JSON.stringify(payload)) }));
                if (out.response && out.response.transformToString) await out.response.transformToString();
              } });
          };

  ResumeSweeperSchedulerRole:
    Type: AWS::IAM::Role
    Condition: CreateResumeSweeper
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeResumeSweeper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ResumeSweeperFunction.Arn

  ResumeSweeperSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: CreateResumeSweeper
    Properties:
      Description: Sweep due WAKE items and resume their AgentCore sessions
      ScheduleExpression: !Ref ResumeSweepSchedule
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ResumeSweeperFunction.Arn
        RoleArn: !GetAtt ResumeSweeperSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  AgentRuntimeExecutionRoleArn:
    Value: !GetAtt AgentRuntimeExecutionRole.Arn
  EcrRepositoryName:
    Value: !Ref ContainerRepository
  EcrRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  SessionTableName:
    Value: !Ref SessionStore
  SessionTableArn:
    Value: !GetAtt SessionStore.Arn
  WakeIndexName:
    Value: wake-index
  ResumeSweeperFunctionName:
    Condition: CreateResumeSweeper
    Value: !Ref ResumeSweeperFunction
  ResumeSweeperScheduleName:
    Condition: CreateResumeSweeper
    Value: !Ref ResumeSweeperSchedule

AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC, ECR, and least-privilege roles for the Pi Durable AgentCore PoC

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub organization or user (for example har1101)
  GitHubRepository:
    Type: String
    Default: pi-durable-agentcore
    Description: Repository name without the owner
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch may assume the deployment role
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Optional existing token.actions.githubusercontent.com provider ARN
  EcrRepositoryName:
    Type: String
    Default: pi-durable-agentcore
  GitHubEnvironment:
    Type: String
    Default: agentcore-poc
    Description: GitHub Actions environment whose OIDC sub may assume the deploy role
  SessionTableName:
    Type: String
    Default: pi-durable-agentcore-sessions
    Description: DynamoDB table for Pi Durable session checkpoints
  GitHubOidcSubPrefix:
    Type: String
    Default: repo:har1101@174846912/pi-durable-agentcore@1422425297
    Description: Immutable GitHub Actions OIDC sub prefix (repo:ownerId/repoId) when use_immutable_subject is true
  AgentRuntimeArn:
    Type: String
    Default: ""
    Description: ARN of the deployed AgentCore runtime the resumer invokes. Empty creates no resumer resources.
  ResumeSweepSchedule:
    Type: String
    Default: rate(1 minute)
    Description: EventBridge schedule expression for the resumer sweep
  ResumeClaimSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: How long one sweep's claim on a due session blocks other sweeps (retry backoff)

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  CreateResumer: !Not [!Equals [!Ref AgentRuntimeArn, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the newest 20 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 20
              },
              "action": { "type": "expire" }
            }]
          }

  SessionStore:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref SessionTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AgentRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullThisRepositoryImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
        - PolicyName: InvokeClaudeOnBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*anthropic.claude-*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-*
        - PolicyName: ReadWriteThisSessionTable
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt SessionStore.Arn
                  - !Sub ${SessionStore.Arn}/index/*
        - PolicyName: WriteAgentCoreRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
        - PolicyName: EmitXRayAndMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"

  ResumerRole:
    Type: AWS::IAM::Role
    Condition: CreateResumer
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ClaimDueWakeItems
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt SessionStore.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - WAKE
        - PolicyName: ResumeThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Ref AgentRuntimeArn
                  - !Sub ${AgentRuntimeArn}/runtime-endpoint/*

  ResumerFunction:
    Type: AWS::Lambda::Function
    Condition: CreateResumer
    Properties:
      Description: Invokes the AgentCore runtime with {"action":"resume"} for sessions whose wake is due
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt ResumerRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionStore
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          QUALIFIER: DEFAULT
          CLAIM_SECONDS: !Ref ResumeClaimSeconds
      Code:
        ZipFile: |
          // Resumer Lambda. Embedded verbatim in infra/github-oidc-bootstrap.yaml by
          // scripts/embed-resumer.mjs; keep it under CloudFormation's 4096-char ZipFile limit.
          "use strict";
          const { QueryCommand, UpdateItemCommand } = require("@aws-sdk/client-dynamodb");

          const due = "dueAt <= :now AND (attribute_not_exists(claimedUntil) OR claimedUntil < :now)";

          // Claims each due wake item, then sends {"action":"resume"} on its session id.
          // A claim blocks other sweeps until claimedUntil; the runtime's next plan clears it.
          async function sweep({ dynamodb, tableName, invoke, now = Date.now(), claimMs = 300000 }) {
            const at = { ":now": { N: String(now) } };
            const items = [];
            let start;
            do {
              const page = await dynamodb.send(new QueryCommand({
                TableName: tableName,
                KeyConditionExpression: "pk = :pk",
                FilterExpression: due,
                ExpressionAttributeValues: { ...at, ":pk": { S: "WAKE" } },
                ConsistentRead: true,
                ExclusiveStartKey: start,
              }));
              items.push(...(page.Items || []));
              start = page.LastEvaluatedKey;
            } while (start);
            return Promise.all(items.map(async (item) => {
              const session = item.runtimeSessionId.S;
              try {
                await dynamodb.send(new UpdateItemCommand({
                  TableName: tableName,
                  Key: { pk: item.pk, sk: item.sk },
                  UpdateExpression: "SET claimedUntil = :until ADD claims :one",
                  ConditionExpression: due,
                  ExpressionAttributeValues: { ...at, ":until": { N: String(now + claimMs) }, ":one": { N: "1" } },
                }));
              } catch (error) {
                if (error.name === "ConditionalCheckFailedException") return { sk: item.sk.S, status: "claimed_elsewhere" };
                throw error;
              }
              try {
                return { sk: item.sk.S, reason: item.reason && item.reason.S, status: "invoked", response: await invoke(session, { action: "resume" }) };
              } catch (error) {
                return { sk: item.sk.S, status: "failed", error: String(error && error.message || error) };
              }
            }));
          }

          async function handler() {
            const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
            const { BedrockAgentCoreClient, InvokeAgentRuntimeCommand } = require("@aws-sdk/client-bedrock-agentcore");
            const agentcore = new BedrockAgentCoreClient({});
            const results = await sweep({
              dynamodb: new DynamoDBClient({}),
              tableName: process.env.TABLE_NAME,
              claimMs: Number(process.env.CLAIM_SECONDS || 300) * 1000,
              invoke: async (runtimeSessionId, payload) => {
                const out = await agentcore.send(new InvokeAgentRuntimeCommand({
                  agentRuntimeArn: process.env.AGENT_RUNTIME_ARN,
                  qualifier: process.env.QUALIFIER || "DEFAULT",
                  runtimeSessionId,
                  contentType: "application/json",
                  accept: "application/json",
                  payload: new TextEncoder().encode(JSON.stringify(payload)),
                }));
                return out.response ? (await out.response.transformToString()).slice(0, 2000) : "";
              },
            });
            console.log(JSON.stringify({ swept: results.length, results }));
            return results;
          }

          module.exports = { sweep, handler };
      # end ResumerFunction code

  ResumerSchedule:
    Type: AWS::Events::Rule
    Condition: CreateResumer
    Properties:
      Description: Sweep due Pi Durable session wakes
      ScheduleExpression: !Ref ResumeSweepSchedule
      State: ENABLED
      Targets:
        - Id: resumer
          Arn: !GetAtt ResumerFunction.Arn

  ResumerSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateResumer
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ResumerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ResumerSchedule.Arn

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub ${GitHubOidcSubPrefix}:environment:${GitHubEnvironment}
                  - !Sub ${GitHubOidcSubPrefix}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: PushThisEcrRepository
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
        - PolicyName: DeployThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverRuntime
                Effect: Allow
                Action: bedrock-agentcore:ListAgentRuntimes
                Resource: "*"
              - Sid: CreateTaggedRuntime
                Effect: Allow
                Action: bedrock-agentcore:CreateAgentRuntime
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: pi-durable-agentcore
              - Sid: ManageRuntimeEndpointsAndVersions
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntimeEndpoint
                  - bedrock-agentcore:CreateAgentRuntimeVersion
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:GetAgentRuntimeVersion
                  - bedrock-agentcore:ListAgentRuntimeEndpoints
                  - bedrock-agentcore:ListAgentRuntimeVersions
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-version/*
              - Sid: TagThisRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:TagResource
                  - bedrock-agentcore:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-version/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*/workload-identity/*
              - Sid: ListWorkloadIdentities
                Effect: Allow
                Action: bedrock-agentcore:ListWorkloadIdentities
                Resource: "*"
              - Sid: ManageWorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:GetWorkloadIdentity
                  - bedrock-agentcore:UpdateWorkloadIdentity
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*/workload-identity/*
              - Sid: UpdateTaggedRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:UpdateAgentRuntime
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: pi-durable-agentcore
              - Sid: PassOnlyExecutionRoleToAgentCore
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentRuntimeExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
        - PolicyName: InvokeThisAgentCoreRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeAndStopRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:InvokeAgentRuntimeForUser
                  - bedrock-agentcore:StopRuntimeSession
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
        - PolicyName: ReadAgentCoreRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: ReadRuntimeLogStreams
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  AgentRuntimeExecutionRoleArn:
    Value: !GetAtt AgentRuntimeExecutionRole.Arn
  EcrRepositoryName:
    Value: !Ref ContainerRepository
  EcrRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  SessionTableName:
    Value: !Ref SessionStore
  SessionTableArn:
    Value: !GetAtt SessionStore.Arn
  ResumerFunctionArn:
    Condition: CreateResumer
    Value: !GetAtt ResumerFunction.Arn
